name: Deploy exo-runner

on:
  workflow_dispatch:

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ansible dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ansible-galaxy collection install -r ansible-collections-requirements.yml

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIKRUS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.MIKRUS_PORT }}" "${{ secrets.MIKRUS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy exo-runner
        run: |
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy-exo-runner.yml \
            -e "ansible_host=${{ secrets.MIKRUS_HOST }}" \
            -e "ansible_port=${{ secrets.MIKRUS_PORT }}" \
            -e "exo_runner_api_key=${{ secrets.EXO_RUNNER_API_KEY }}" \
            -e "exo_app_id=${{ secrets.EXO_APP_ID }}" \
            -e "exo_organization=${{ secrets.EXO_ORGANIZATION }}" \
            -e "exo_cert_password=${{ secrets.EXO_CERT_PASSWORD }}" \
            -e "exo_cert_pfx_base64=${{ secrets.EXO_CERT_PFX_BASE64 }}"
